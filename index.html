<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirata Island - Grand Line Adventure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #07090e; }
        .pirate-title { font-family: 'Cinzel', serif; }
        .game-panel {
            background: linear-gradient(145deg, #131b2e 0%, #0a0f1d 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 215, 0, 0.2);
        }
        .bounty-card {
            background: linear-gradient(135deg, #261c14 0%, #17110c 100%);
            border: 2px solid #d4af37;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4">
    <div id="root" class="w-full max-w-md"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = 'https://pirata-island-backend.onrender.com/api';

        function App() {
            const [player, setPlayer] = useState(null);
            const [loading, setLoading] = useState(true);
            const [currentTab, setCurrentTab] = useState('island');
            const [battleLog, setBattleLog] = useState('⚓ ¡El mar está listo! Elige tu acción para conquistar el Grand Line.');
            const [activeSkin, setActiveSkin] = useState('Luffy');

            useEffect(() => {
                fetch(`${API_URL}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId: 'user_12345', username: 'Nakama' })
                })
                .then(res => res.json())
                .then(data => {
                    setPlayer(data);
                    setLoading(false);
                })
                .catch(() => setLoading(false));
            }, []);

            const handleFight = async () => {
                if (!player || player.energy < 10) return;
                try {
                    const res = await fetch(`${API_URL}/fight`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ telegramId: player.telegramId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setPlayer(data.player);
                        setBattleLog(`⚔️ ¡Victoria! Derrotaste a la Marina y conseguiste +${data.earnedBeli} Beli.`);
                    }
                } catch(e) {
                    setBattleLog('⚠️ Error al conectar con el servidor.');
                }
            };

            const handleClaim = async () => {
                try {
                    const res = await fetch(`${API_URL}/claim`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ telegramId: player.telegramId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setPlayer(prev => ({ ...prev, cryptoTokens: data.cryptoTokens }));
                        setBattleLog('💎 ¡Tesoros recolectados de las Frutas del Diablo con éxito!');
                    }
                } catch(e) {
                    setBattleLog('⚠️ Error al reclamar tesoros.');
                }
            };

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center p-10 text-center game-panel rounded-3xl border border-amber-500/30">
                        <div className="animate-spin rounded-full h-14 w-14 border-4 border-amber-500 border-t-transparent mb-4 shadow-lg shadow-amber-500/20"></div>
                        <p className="pirate-title text-amber-400 text-lg tracking-widest animate-pulse">Zarpando al Nuevo Mundo...</p>
                    </div>
                );
            }

            return (
                <div className="game-panel rounded-3xl overflow-hidden border border-amber-500/40 shadow-2xl">
                    
                    {/* Header / Tarjeta de Perfil Estilo Recompensa */}
                    <div className="bounty-card p-4 relative overflow-hidden">
                        <div className="absolute -right-4 -bottom-4 text-7xl opacity-10">🏴‍☠️</div>
                        <div className="flex items-center gap-3 relative z-10">
                            <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center text-3xl shadow-lg border-2 border-yellow-200">
                                {activeSkin === 'Luffy' ? '👒' : '⚔️'}
                            </div>
                            <div className="flex-1">
                                <div className="flex items-center justify-between">
                                    <h2 className="pirate-title text-amber-400 text-base tracking-wider font-extrabold">{player?.username || 'Nakama'}</h2>
                                    <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/40 font-bold">Nivel 1</span>
                                </div>
                                <p className="text-xs text-amber-200/70 mt-0.5">Recompensa: <span className="text-yellow-300 font-bold">15,000,000 🪙</span></p>
                            </div>
                        </div>

                        {/* Barra de Experiencia / Progreso */}
                        <div className="mt-3 w-full bg-black/40 rounded-full h-2 overflow-hidden border border-amber-500/20">
                            <div className="bg-gradient-to-r from-amber-500 to-yellow-300 h-full w-3/4 rounded-full"></div>
                        </div>
                    </div>

                    {/* Barra de Recursos Interactiva */}
                    <div className="grid grid-cols-3 gap-2 p-3 bg-slate-950/90 border-y border-slate-800 text-center">
                        <div className="bg-slate-900/80 p-2.5 rounded-2xl border border-amber-500/20 shadow">
                            <span className="text-[9px] uppercase tracking-wider text-amber-400 font-extrabold block"><i className="fa-solid fa-coins mr-1"></i> Beli</span>
                            <span className="font-extrabold text-amber-300 text-sm">{player?.beli || 0}</span>
                        </div>
                        <div className="bg-slate-900/80 p-2.5 rounded-2xl border border-emerald-500/20 shadow">
                            <span className="text-[9px] uppercase tracking-wider text-emerald-400 font-extrabold block"><i className="fa-solid fa-bolt mr-1"></i> Energía</span>
                            <span className="font-extrabold text-emerald-300 text-sm">{player?.energy || 0}/100</span>
                        </div>
                        <div className="bg-slate-900/80 p-2.5 rounded-2xl border border-cyan-500/20 shadow">
                            <span className="text-[9px] uppercase tracking-wider text-cyan-400 font-extrabold block"><i className="fa-solid fa-gem mr-1"></i> Tokens</span>
                            <span className="font-extrabold text-cyan-300 text-sm">{player?.cryptoTokens || 0}</span>
                        </div>
                    </div>

                    {/* Área Principal de Contenido */}
                    <div className="p-4 min-h-[300px] flex flex-col justify-between">
                        
                        {currentTab === 'island' && (
                            <div className="space-y-4">
                                <div className="relative bg-gradient-to-b from-amber-950/40 via-slate-900 to-slate-900 p-4 rounded-2xl border border-amber-600/30 text-center shadow-inner">
                                    <div className="absolute top-2.5 right-2.5 bg-amber-500/20 text-amber-300 text-[10px] px-2.5 py-0.5 rounded-full border border-amber-500/40 font-bold">
                                        <i className="fa-solid fa-compass mr-1"></i> East Blue
                                    </div>
                                    <div className="text-6xl my-3 filter drop-shadow-[0_5px_5px_rgba(0,0,0,0.5)]">🏝️</div>
                                    
                                    {/* Panel de Log de Batalla */}
                                    <div className="bg-black/40 p-3 rounded-xl border border-slate-800">
                                        <p className="text-xs text-slate-300 italic font-medium leading-relaxed">
                                            "{battleLog}"
                                        </p>
                                    </div>
                                </div>

                                <div className="space-y-2.5">
                                    <button 
                                        onClick={handleFight}
                                        className="w-full bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold py-3.5 px-4 rounded-2xl transition duration-200 shadow-xl shadow-red-950/50 flex items-center justify-center gap-2.5 border border-amber-400/30 text-sm tracking-wide cursor-pointer active:scale-95"
                                    >
                                        <i className="fa-solid fa-skull text-yellow-300 text-base"></i> Cazar Piratas / Marina <span className="text-xs bg-black/30 px-2 py-0.5 rounded-lg text-amber-300">10 ⚡</span>
                                    </button>
                                    <button 
                                        onClick={handleClaim}
                                        className="w-full bg-gradient-to-r from-cyan-600 via-blue-600 to-indigo-700 hover:from-cyan-500 hover:to-blue-600 text-white font-bold py-3 px-4 rounded-2xl transition duration-200 shadow-xl shadow-cyan-950/50 flex items-center justify-center gap-2.5 border border-cyan-400/30 text-sm tracking-wide cursor-pointer active:scale-95"
                                    >
                                        <i className="fa-solid fa-lemon text-yellow-300 text-base"></i> Cosechar Frutas del Diablo
                                    </button>
                                </div>
                            </div>
                        )}

                        {currentTab === 'map' && (
                            <div className="space-y-3">
                                <h3 className="pirate-title text-amber-400 text-xs tracking-wider text-center uppercase font-bold mb-3">
                                    <i className="fa-solid fa-map-marked-alt mr-1"></i> Cartografía del Grand Line
                                </h3>
                                <div className="space-y-2.5">
                                    <div className="bg-amber-950/40 p-3.5 rounded-2xl border border-amber-500/40 flex items-center justify-between shadow-md">
                                        <div className="flex items-center gap-3">
                                            <div className="text-2xl">🌊</div>
                                            <div>
                                                <div className="text-sm font-bold text-amber-300">East Blue</div>
                                                <p className="text-[11px] text-slate-400">Mar seguro. Nivel recomendado: 1+</p>
                                            </div>
                                        </div>
                                        <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full border border-emerald-500/40 font-bold">Activo</span>
                                    </div>
                                    <div className="bg-slate-950/60 p-3.5 rounded-2xl border border-slate-800/80 flex items-center justify-between opacity-60">
                                        <div className="flex items-center gap-3">
                                            <div className="text-2xl">⚡</div>
                                            <div>
                                                <div className="text-sm font-bold text-slate-400">Grand Line</div>
                                                <p className="text-[11px] text-slate-500">Requiere Nivel 25</p>
                                            </div>
                                        </div>
                                        <span className="text-[10px] bg-slate-800 text-slate-400 px-3 py-1 rounded-full font-bold">🔒 Bloqueado</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentTab === 'crew' && (
                            <div className="space-y-3">
                                <h3 className="pirate-title text-amber-400 text-xs tracking-wider text-center uppercase font-bold mb-3">
                                    <i className="fa-solid fa-user-ninja mr-1"></i> Selección de Capitanes
                                </h3>
                                <div className="grid grid-cols-2 gap-3">
                                    <div 
                                        onClick={() => setActiveSkin('Luffy')}
                                        className={`p-3.5 rounded-2xl border cursor-pointer transition text-center shadow-lg ${activeSkin === 'Luffy' ? 'bg-amber-950/60 border-amber-500 ring-2 ring-amber-500/30' : 'bg-slate-950/60 border-slate-800 opacity-70 hover:opacity-100'}`}
                                    >
                                        <div className="text-4xl mb-2">👒</div>
                                        <p className="text-xs font-bold text-amber-300">Sombrero de Paja</p>
                                        <span className="inline-block mt-2 text-[10px] px-2.5 py-0.5 rounded-full font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                                            {activeSkin === 'Luffy' ? 'Equipado ⚓' : 'Seleccionar'}
                                        </span>
                                    </div>
                                    <div 
                                        onClick={() => setActiveSkin('Zoro')}
                                        className={`p-3.5 rounded-2xl border cursor-pointer transition text-center shadow-lg ${activeSkin === 'Zoro' ? 'bg-amber-950/60 border-amber-500 ring-2 ring-amber-500/30' : 'bg-slate-950/60 border-slate-800 opacity-70 hover:opacity-100'}`}
                                    >
                                        <div className="text-4xl mb-2">⚔️</div>
                                        <p className="text-xs font-bold text-amber-300">Roronoa Zoro</p>
                                        <span className="inline-block mt-2 text-[10px] px-2.5 py-0.5 rounded-full font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                                            {activeSkin === 'Zoro' ? 'Equipado ⚓' : 'Seleccionar'}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Barra de Navegación Inferior Estilizada */}
                    <div className="grid grid-cols-3 border-t border-slate-800/80 bg-slate-950 p-1.5 gap-1">
                        <button 
                            onClick={() => setCurrentTab('island')}
                            className={`py-2.5 rounded-xl text-xs font-bold flex flex-col items-center gap-1 transition duration-200 ${currentTab === 'island' ? 'text-amber-400 bg-amber-500/10 border border-amber-500/30 shadow' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-island-tropical text-sm"></i> Isla
                        </button>
                        <button 
                            onClick={() => setCurrentTab('map')}
                            className={`py-2.5 rounded-xl text-xs font-bold flex flex-col items-center gap-1 transition duration-200 ${currentTab === 'map' ? 'text-amber-400 bg-amber-500/10 border border-amber-500/30 shadow' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-compass text-sm"></i> Mapas
                        </button>
                        <button 
                            onClick={() => setCurrentTab('crew')}
                            className={`py-2.5 rounded-xl text-xs font-bold flex flex-col items-center gap-1 transition duration-200 ${currentTab === 'crew' ? 'text-amber-400 bg-amber-500/10 border border-amber-500/30 shadow' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-users text-sm"></i> Skins
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
