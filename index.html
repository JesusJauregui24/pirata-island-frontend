<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirata Island - One Piece Telegram App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome para iconos temáticos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
        .pirate-title { font-family: 'Cinzel', serif; }
        .grand-line-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
        }
        .parchment-card {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body class="grand-line-bg text-slate-100 min-h-screen flex items-center justify-center p-3">
    <div id="root" class="w-full max-w-md"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = 'https://pirata-island-backend.onrender.com/api';

        function App() {
            const [player, setPlayer] = useState(null);
            const [loading, setLoading] = useState(true);
            const [currentTab,함으로써, setCurrentTab] = useState('island'); // 'island', 'map', 'crew'
            const [battleLog, setBattleLog] = useState('¡El mar está calmado! Elige tu próxima aventura en el Grand Line.');
            const [activeSkin, setActiveSkin] = useState('Luffy');

            useEffect(() => {
                fetch(`${API_URL}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId: 'user_12345', username: 'Nakama' })
                })
                .then(res => res.json())
                .then(data => {
                    setPlayer(data);
                    setLoading(false);
                })
                .catch(err => {
                    console.error(err);
                    setLoading(false);
                });
            }, []);

            const handleFight = async () => {
                if (!player || player.energy < 10) return;
                try {
                    const res = await fetch(`${API_URL}/fight`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ telegramId: player.telegramId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setPlayer(data.player);
                        setBattleLog(`⚔️ ¡Combate exitoso! Derrotaste a un buque de la Marina y obtuviste ${data.earnedBeli} Beli.`);
                    }
                } catch(e) {
                    setBattleLog('⚠️ Error de conexión con la base naval.');
                }
            };

            const handleClaim = async () => {
                try {
                    const res = await fetch(`${API_URL}/claim`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ telegramId: player.telegramId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setPlayer(prev => ({ ...prev, cryptoTokens: data.cryptoTokens }));
                        setBattleLog('💎 ¡Has cosechado las ganancias de tus Frutas del Diablo con éxito!');
                    }
                } catch(e) {
                    setBattleLog('⚠️ Error al reclamar el tesoro.');
                }
            };

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center p-8 text-center parchment-card rounded-2xl shadow-2xl">
                        <div className="animate-spin rounded-full h-14 w-14 border-4 border-amber-500 border-t-transparent mb-4"></div>
                        <p className="pirate-title text-amber-400 text-lg tracking-widest">Zarpando al Nuevo Mundo...</p>
                    </div>
                );
            }

            return (
                <div className="parchment-card rounded-2xl shadow-2xl overflow-hidden border-2 border-amber-500/40 backdrop-blur-md">
                    
                    {/* Header Estilo One Piece */}
                    <div className="bg-gradient-to-r from-amber-950 via-slate-900 to-amber-950 p-4 border-b border-amber-500/30 text-center relative">
                        <div className="absolute top-2 left-3 text-xs bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-full border border-amber-500/30 font-semibold">
                            <i className="fa-solid fa-anchor mr-1"></i> Grand Line
                        </div>
                        <h1 className="pirate-title text-2xl text-amber-400 tracking-wider drop-shadow-lg pt-1">
                            <i className="fa-solid fa-skull-crossbones text-amber-500 mr-1"></i> PIRATA ISLAND
                        </h1>
                        <p className="text-xs text-amber-200/70 mt-1">Capitán: <span className="font-bold text-amber-300">{player?.username || 'Nakama'}</span></p>
                    </div>

                    {/* Barra de Estadísticas */}
                    <div className="grid grid-cols-3 gap-2 p-3 bg-slate-950/80 border-b border-slate-800 text-center">
                        <div className="bg-slate-900/90 p-2 rounded-xl border border-amber-500/20 shadow-inner">
                            <span className="text-[10px] uppercase text-amber-400 font-bold block"><i className="fa-solid fa-coins"></i> Beli</span>
                            <span className="font-extrabold text-amber-300 text-sm">{player?.beli || 0}</span>
                        </div>
                        <div className="bg-slate-900/90 p-2 rounded-xl border border-emerald-500/20 shadow-inner">
                            <span className="text-[10px] uppercase text-emerald-400 font-bold block"><i className="fa-solid fa-bolt"></i> Energía</span>
                            <span className="font-extrabold text-emerald-300 text-sm">{player?.energy || 0}/100</span>
                        </div>
                        <div className="bg-slate-900/90 p-2 rounded-xl border border-cyan-500/20 shadow-inner">
                            <span className="text-[10px] uppercase text-cyan-400 font-bold block"><i className="fa-solid fa-gem"></i> Tokens</span>
                            <span className="font-extrabold text-cyan-300 text-sm">{player?.cryptoTokens || 0}</span>
                        </div>
                    </div>

                    {/* Contenido Dinámico según Pestaña */}
                    <div className="p-4 min-h-[280px] flex flex-col justify-between">
                        
                        {currentTab === 'island' && (
                            <div className="space-y-4">
                                <div className="relative bg-gradient-to-b from-amber-900/20 to-slate-900 p-4 rounded-xl border border-amber-600/30 text-center shadow-lg">
                                    <div className="absolute top-2 right-2 bg-amber-500/20 text-amber-300 text-[10px] px-2 py-0.5 rounded-full border border-amber-500/40">
                                        <i className="fa-solid fa-location-dot"></i> Isla Principal
                                    </div>
                                    <div className="text-5xl my-2 drop-shadow-md">🏝️</div>
                                    <p className="text-xs text-slate-300 italic min-h-[40px] flex items-center justify-center px-2 font-medium">
                                        "{battleLog}"
                                    </p>
                                </div>

                                <div className="space-y-2.5">
                                    <button 
                                        onClick={handleFight}
                                        className="w-full bg-gradient-to-r from-red-700 to-amber-700 hover:from-red-600 hover:to-amber-600 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg flex items-center justify-center gap-2 border border-amber-500/40 text-sm tracking-wide cursor-pointer"
                                    >
                                        <i className="fa-solid fa- swords"></i> Cazar Piratas / Marina (10 ⚡)
                                    </button>
                                    <button 
                                        onClick={handleClaim}
                                        className="w-full bg-gradient-to-r from-cyan-700 to-blue-800 hover:from-cyan-600 hover:to-blue-700 text-white font-bold py-2.5 px-4 rounded-xl transition duration-200 shadow-lg flex items-center justify-center gap-2 border border-cyan-500/40 text-sm tracking-wide cursor-pointer"
                                    >
                                        <i className="fa-solid fa-lemon text-yellow-400"></i> Cosechar Frutas del Diablo
                                    </button>
                                </div>
                            </div>
                        )}

                        {currentTab === 'map' && (
                            <div className="space-y-3 text-center">
                                <h3 className="pirate-title text-amber-400 text-sm tracking-wider mb-2">
                                    <i className="fa-solid fa-map"></i> MAPA DE NAVEGACIÓN
                                </h3>
                                <div className="grid grid-cols-1 gap-2">
                                    <div className="bg-amber-950/40 p-3 rounded-xl border border-amber-500/40 text-left flex items-center justify-between">
                                        <div>
                                            <div className="text-sm font-bold text-amber-300"><i className="fa-solid fa-water mr-1"></i> East Blue</div>
                                            <p className="text-[11px] text-slate-400">Mar de origen. Nivel recomendado: 1+</p>
                                        </div>
                                        <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-500/40 font-bold">Activo</span>
                                    </div>
                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-left flex items-center justify-between opacity-60">
                                        <div>
                                            <div className="text-sm font-bold text-slate-400"><i className="fa-solid fa-globe mr-1"></i> Grand Line</div>
                                            <p className="text-[11px] text-slate-500">Requiere Nivel 25 y Barco de Mayor Calidad</p>
                                        </div>
                                        <span className="text-[10px] bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full">Bloqueado 🔒</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentTab === 'crew' && (
                            <div className="space-y-3 text-center">
                                <h3 className="pirate-title text-amber-400 text-sm tracking-wider mb-2">
                                    <i className="fa-solid fa-users"></i> SELECCIÓN DE CAPITANES (SKINS)
                                </h3>
                                <div className="grid grid-cols-2 gap-2">
                                    <div 
                                        onClick={() => setActiveSkin('Luffy')}
                                        className={`p-3 rounded-xl border cursor-pointer transition text-center ${activeSkin === 'Luffy' ? 'bg-amber-950/60 border-amber-500 shadow-md' : 'bg-slate-950/60 border-slate-800 opacity-70'}`}
                                    >
                                        <div className="text-3xl mb-1">👒</div>
                                        <p className="text-xs font-bold text-amber-300">Sombrero de Paja</p>
                                        <span className="text-[10px] text-emerald-400 block mt-1">{activeSkin === 'Luffy' ? 'Equipado ⚓' : 'Seleccionar'}</span>
                                    </div>
                                    <div 
                                        onClick={() => setActiveSkin('Zoro')}
                                        className={`p-3 rounded-xl border cursor-pointer transition text-center ${activeSkin === 'Zoro' ? 'bg-amber-950/60 border-amber-500 shadow-md' : 'bg-slate-950/60 border-slate-800 opacity-70'}`}
                                    >
                                        <div className="text-3xl mb-1">⚔️</div>
                                        <p className="text-xs font-bold text-amber-300">Espadachín Roronoa</p>
                                        <span className="text-[10px] text-emerald-400 block mt-1">{activeSkin === 'Zoro' ? 'Equipado ⚓' : 'Seleccionar'}</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Barra de Navegación Inferior */}
                    <div className="grid grid-cols-3 border-t border-slate-800 bg-slate-950">
                        <button 
                            onClick={() => setCurrentTab('island')}
                            className={`py-3 text-xs font-semibold flex flex-col items-center gap-1 transition ${currentTab === 'island' ? 'text-amber-400 bg-slate-900/90 border-t-2 border-amber-500' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-island-tropical text-base"></i> Isla
                        </button>
                        <button 
                            onClick={() => setCurrentTab('map')}
                            className={`py-3 text-xs font-semibold flex flex-col items-center gap-1 transition ${currentTab === 'map' ? 'text-amber-400 bg-slate-900/90 border-t-2 border-amber-500' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-compass text-base"></i> Mapas
                        </button>
                        <button 
                            onClick={() => setCurrentTab('crew')}
                            className={`py-3 text-xs font-semibold flex flex-col items-center gap-1 transition ${currentTab === 'crew' ? 'text-amber-400 bg-slate-900/90 border-t-2 border-amber-500' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-user-ninja text-base"></i> Skins
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
