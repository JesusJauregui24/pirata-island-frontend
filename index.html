<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirata Island - Telegram Mini App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        telomon: {
                            dark: '#070b12',
                            card: '#0f172a',
                            border: '#1e293b',
                            gold: '#f59e0b',
                            emerald: '#10b981',
                            cyan: '#06b6d4'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #05080f; color: #f8fafc; touch-action: manipulation; }
        .banner-glow { box-shadow: 0 10px 30px rgba(245, 158, 11, 0.25); }
        .btn-glow { box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4); }
        .app-container { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
    </style>
</head>
<body>
    <div id="root" class="app-container"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [tab, setTab] = useState('home');
            const [beli, setBeli] = useState(24500);
            const [energy, setEnergy] = useState(900);
            const [maxEnergy, setMaxEnergy] = useState(1000);
            const [tokens, setTokens] = useState(125);

            // Rellenar energía gradualmente
            useEffect(() => {
                const timer = setInterval(() => {
                    setEnergy(prev => Math.min(maxEnergy, prev + 3));
                }, 1000);
                return () => clearInterval(timer);
            }, [maxEnergy]);

            const handleAction = () => {
                if (energy < 15) return;
                setEnergy(prev => prev - 15);
                setBeli(prev => prev + 120);
            };

            return (
                <div className="flex flex-col h-screen justify-between pb-20 select-none">
                    
                    {/* Header Estilo Bot Telegram */}
                    <header className="px-4 pt-4 pb-3 bg-telomon-dark/90 backdrop-blur-md sticky top-0 z-30 border-b border-telomon-border flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-600 via-yellow-500 to-emerald-500 flex items-center justify-center text-lg shadow-lg border border-amber-300/40">
                                🏴‍☠️
                            </div>
                            <div>
                                <h1 className="text-sm font-extrabold tracking-wide text-slate-100 flex items-center gap-1">
                                    Pirata Island <i className="fa-solid fa-circle-check text-cyan-400 text-xs"></i>
                                </h1>
                                <p className="text-[11px] text-amber-400 font-bold">Nakama • Nivel 15</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="bg-telomon-card px-2.5 py-1 rounded-xl border border-telomon-border flex items-center gap-1 text-xs font-bold text-amber-300">
                                <i className="fa-solid fa-coins"></i> {beli.toLocaleString()}
                            </div>
                        </div>
                    </header>

                    {/* Contenido Principal */}
                    <main className="flex-1 px-4 py-3 overflow-y-auto space-y-4">
                        
                        {tab === 'home' && (
                            <div className="space-y-4">
                                {/* Banner Principal Estilo Telomon Play & Earn */}
                                <div className="relative rounded-3xl overflow-hidden border-2 border-amber-500/40 banner-glow bg-gradient-to-b from-amber-950/80 via-slate-900 to-telomon-card p-5 text-center">
                                    <div className="absolute top-2 right-3 flex gap-1">
                                        <span className="bg-amber-500/20 text-amber-300 text-[10px] px-2 py-0.5 rounded-full border border-amber-500/30 font-bold">⚡ TON Network</span>
                                    </div>
                                    <div className="text-5xl my-2">🏝️⚔️</div>
                                    <h2 className="text-lg font-black text-amber-400 tracking-wide uppercase">PIRATA ISLAND PLAY & EARN</h2>
                                    <p className="text-xs text-slate-300 mt-1 px-2 font-medium">Captura Nakamas, combate contra la Marina, explora los mares y gana recompensas reales.</p>
                                    
                                    <div className="grid grid-cols-2 gap-2 mt-4">
                                        <div className="bg-black/40 p-2.5 rounded-2xl border border-amber-500/20">
                                            <span className="text-[10px] text-slate-400 block uppercase font-bold">Tokens TON</span>
                                            <span className="text-sm font-extrabold text-cyan-300">{tokens} 💎</span>
                                        </div>
                                        <div className="bg-black/40 p-2.5 rounded-2xl border border-emerald-500/20">
                                            <span className="text-[10px] text-slate-400 block uppercase font-bold">Energía</span>
                                            <span className="text-sm font-extrabold text-emerald-400">{energy}/{maxEnergy}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Botón de Acción Principal (Estilo Clicker / Bot de Batalla) */}
                                <div className="text-center space-y-3 pt-2">
                                    <button 
                                        onClick={handleAction}
                                        className="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 text-slate-950 font-black text-sm uppercase tracking-wider btn-glow border border-amber-200 active:scale-95 transition flex items-center justify-center gap-2 cursor-pointer shadow-xl"
                                    >
                                        <i className="fa-solid fa-sword text-lg"></i> Cazar / Combate Rápido (-15 ⚡)
                                    </button>
                                </div>

                                {/* Características rápidas del Bot */}
                                <div className="grid grid-cols-2 gap-2.5 pt-1">
                                    <div className="bg-telomon-card p-3 rounded-2xl border border-telomon-border flex items-center gap-3">
                                        <div className="text-2xl bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20">🏴‍☠️</div>
                                        <div>
                                            <h4 className="text-xs font-bold text-slate-100">Capturar Nakamas</h4>
                                            <p className="text-[10px] text-slate-400">Rarezas épicas</p>
                                        </div>
                                    </div>
                                    <div className="bg-telomon-card p-3 rounded-2xl border border-telomon-border flex items-center gap-3">
                                        <div className="text-2xl bg-cyan-500/10 p-2.5 rounded-xl border border-cyan-500/20">🌍</div>
                                        <div>
                                            <h4 className="text-xs font-bold text-slate-100">Explorar Mares</h4>
                                            <p className="text-[10px] text-slate-400">Grand Line</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === 'team' && (
                            <div className="space-y-3">
                                <h3 className="text-sm font-extrabold text-amber-400 flex items-center gap-2">
                                    <i className="fa-solid fa-users"></i> Tu Tripulación y Nakamas
                                </h3>
                                <div className="grid grid-cols-2 gap-2.5">
                                    <div className="bg-telomon-card p-3 rounded-2xl border border-amber-500/30 text-center relative overflow-hidden">
                                        <span className="absolute top-2 right-2 text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded font-bold">Épico</span>
                                        <div className="text-4xl my-2">👒</div>
                                        <h4 className="text-xs font-bold text-slate-100">Sombrero de Paja</h4>
                                        <p className="text-[10px] text-amber-400 mt-0.5 font-bold">Nivel 25 • ATK 450</p>
                                    </div>
                                    <div className="bg-telomon-card p-3 rounded-2xl border border-cyan-500/30 text-center relative overflow-hidden">
                                        <span className="absolute top-2 right-2 text-[9px] bg-cyan-500/20 text-cyan-300 px-1.5 py-0.5 rounded font-bold">Raro</span>
                                        <div className="text-4xl my-2">⚔️</div>
                                        <h4 className="text-xs font-bold text-slate-100">Espadachín Roronoa</h4>
                                        <p className="text-[10px] text-cyan-400 mt-0.5 font-bold">Nivel 20 • ATK 380</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === 'earn' && (
                            <div className="space-y-3">
                                <h3 className="text-sm font-extrabold text-amber-400 flex items-center gap-2">
                                    <i className="fa-solid fa-gift"></i> Misiones y Recompensas TON
                                </h3>
                                
                                <div className="bg-telomon-card p-3.5 rounded-2xl border border-telomon-border flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="text-2xl bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20">📢</div>
                                        <div>
                                            <h4 className="text-xs font-bold text-slate-100">Unirse al Canal Oficial</h4>
                                            <p className="text-[11px] text-amber-400 font-bold">+5,000 Beli</p>
                                        </div>
                                    </div>
                                    <button className="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold px-3.5 py-2 rounded-xl transition shadow">
                                        Reclamar
                                    </button>
                                </div>

                                <div className="bg-telomon-card p-3.5 rounded-2xl border border-telomon-border flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="text-2xl bg-cyan-500/10 p-2.5 rounded-xl border border-cyan-500/20">👥</div>
                                        <div>
                                            <h4 className="text-xs font-bold text-slate-100">Invitar Amigos</h4>
                                            <p className="text-[11px] text-cyan-400 font-bold">+10 Tokens por amigo</p>
                                        </div>
                                    </div>
                                    <button className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-extrabold px-3.5 py-2 rounded-xl transition shadow">
                                        Invitar
                                    </button>
                                </div>
                            </div>
                        )}

                        {tab === 'profile' && (
                            <div className="space-y-3">
                                <div className="bg-telomon-card p-5 rounded-3xl border border-telomon-border text-center space-y-3">
                                    <div className="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center text-4xl shadow-xl border-2 border-amber-300">
                                        👑
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-sm text-slate-100">Capitán Nakama</h3>
                                        <p className="text-xs text-amber-400 font-bold">@nakama_telegram</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 pt-2">
                                        <div className="bg-telomon-dark p-2.5 rounded-xl border border-telomon-border">
                                            <span className="text-[10px] text-slate-400 block font-bold uppercase">Batallas Ganadas</span>
                                            <span className="text-xs font-extrabold text-amber-300">142</span>
                                        </div>
                                        <div className="bg-telomon-dark p-2.5 rounded-xl border border-telomon-border">
                                            <span className="text-[10px] text-slate-400 block font-bold uppercase">Rango Global</span>
                                            <span className="text-xs font-extrabold text-emerald-300">Top 5%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Barra de Navegación Inferior Estilo Telegram Mini App */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-[440px] mx-auto bg-telomon-dark/95 backdrop-blur-md border-t border-telomon-border px-3 py-2 grid grid-cols-4 gap-1 z-40 shadow-2xl">
                        <button 
                            onClick={() => setTab('home')}
                            className={`flex flex-col items-center py-2 rounded-xl transition font-bold text-xs ${tab === 'home' ? 'text-amber-400 bg-amber-500/10 border border-amber-500/30' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-house text-base mb-0.5"></i>
                            <span>Inicio</span>
                        </button>
                        <button 
                            onClick={() => setTab('team')}
                            className={`flex flex-col items-center py-2 rounded-xl transition font-bold text-xs ${tab === 'team' ? 'text-amber-400 bg-amber-500/10 border border-amber-500/30' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-users text-base mb-0.5"></i>
                            <span>Equipo</span>
                        </button>
                        <button 
                            onClick={() => setTab('earn')}
                            className={`flex flex-col items-center py-2 rounded-xl transition font-bold text-xs ${tab === 'earn' ? 'text-amber-400 bg-amber-500/10 border border-amber-500/30' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-coins text-base mb-0.5"></i>
                            <span>Ganar</span>
                        </button>
                        <button 
                            onClick={() => setTab('profile')}
                            className={`flex flex-col items-center py-2 rounded-xl transition font-bold text-xs ${tab === 'profile' ? 'text-amber-400 bg-amber-500/10 border border-amber-500/30' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i className="fa-solid fa-user text-base mb-0.5"></i>
                            <span>Perfil</span>
                        </button>
                    </nav>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
