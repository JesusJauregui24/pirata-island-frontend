<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirata Island - Telegram Mini App</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para compilar el código en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = 'https://pirata-island-backend.onrender.com/api';

        function App() {
            const [player, setPlayer] = useState(null);
            const [loading, setLoading] = useState(true);
            const [battleLog, setBattleLog] = useState('Explora la isla para cazar piratas.');

            useEffect(() => {
                fetch(`${API_URL}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId: 'user_12345', username: 'Nakama_Test' })
                })
                .then(res => res.json())
                .then(data => {
                    setPlayer(data);
                    setLoading(false);
                })
                .catch(err => console.error(err));
            }, []);

            const handleFight = async () => {
                if (!player || player.energy < 10) return;
                const res = await fetch(`${API_URL}/fight`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId: player.telegramId })
                });
                const data = await res.json();
                if (data.success) {
                    setPlayer(data.player);
                    setBattleLog(`¡Derrotaste a un pirata de la Marina y ganaste ${data.earnedBeli} Beli! ⚔️`);
                }
            };

            const handleClaim = async () => {
                const res = await fetch(`${API_URL}/claim`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId: player.telegramId })
                });
                const data = await res.json();
                if (data.success) {
                    setPlayer(prev => ({ ...prev, cryptoTokens: data.cryptoTokens }));
                    setBattleLog('¡Has recolectado tus ganancias de cripto de las Frutas del Diablo! 💎');
                }
            };

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center p-6 text-center">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-400 mb-4"></div>
                        <p className="text-lg font-semibold">Cargando Pirata Island...</p>
                    </div>
                );
            }

            return (
                <div className="max-w-md w-full mx-auto p-4 bg-slate-800 rounded-xl shadow-2xl border border-yellow-500/30">
                    <header className="text-center mb-6">
                        <h1 className="text-2xl font-black text-yellow-400 tracking-wider">🏴‍☠️ PIRATA ISLAND</h1>
                        <p className="text-xs text-slate-400">Nakama: {player?.username}</p>
                    </header>

                    <div className="grid grid-cols-3 gap-2 mb-6 bg-slate-900/50 p-3 rounded-lg text-center border border-slate-700">
                        <div>
                            <p className="text-xs text-slate-400">Beli</p>
                            <p className="font-bold text-yellow-400">🪙 {player?.beli}</p>
                        </div>
                        <div>
                            <p className="text-xs text-slate-400">Energía</p>
                            <p className="font-bold text-emerald-400">⚡ {player?.energy}/100</p>
                        </div>
                        <div>
                            <p className="text-xs text-slate-400">Tokens</p>
                            <p className="font-bold text-cyan-400">💎 {player?.cryptoTokens}</p>
                        </div>
                    </div>

                    <div className="bg-slate-900 p-4 rounded-lg mb-6 border border-slate-700 text-center">
                        <p className="text-sm text-slate-300 min-h-[40px] flex items-center justify-center">{battleLog}</p>
                    </div>

                    <div className="space-y-3">
                        <button 
                            onClick={handleFight}
                            className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg flex items-center justify-center gap-2 cursor-pointer"
                        >
                            ⚔️ Cazar Piratas (Gastar 10 Energía)
                        </button>
                        <button 
                            onClick={handleClaim}
                            className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg flex items-center justify-center gap-2 cursor-pointer"
                        >
                            💎 Reclamar Cripto-Frutas
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
